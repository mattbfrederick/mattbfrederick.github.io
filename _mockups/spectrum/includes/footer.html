<footer class="site-footer">

    <a class="brand" href="{{ "/" | relative_url }}">{% include logo.svg %}<span>FineSine</span></a>
    <p class="footer-note">Wireless networking, from the RF up.</p>
    <p class="footer-links">
      <a href="{{ "/feed.xml" | relative_url }}">rss</a>
      {%- if site.linkedin_url %}<a href="{{ site.linkedin_url }}">linkedin</a>{% endif %}
      <a href="{{ "/about/" | relative_url }}">about</a>
    </p>
    <p class="copyright">&copy; {{ site.time | date: "%Y" }} {{ site.author | escape }}</p>

</footer>
