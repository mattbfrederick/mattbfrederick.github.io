<footer class="site-footer">
  <div class="wrap footer-grid">
    <div>
      <a class="brand" href="{{ "/" | relative_url }}"><span class="brand-badge">{% include logo.svg %}</span><span>FineSine</span></a>
      <p class="footer-about">A wireless networking blog by Matt Frederick, a WLAN consultant and CWNE&nbsp;#197.</p>
    </div>
    <nav class="footer-links" aria-label="Footer">
      <a href="{{ "/" | relative_url }}#posts">All posts</a>
      <a href="{{ "/tags/" | relative_url }}">Tags</a>
      <a href="{{ "/about/" | relative_url }}">About</a>
      <a href="{{ "/feed.xml" | relative_url }}">RSS feed</a>
      {%- if site.linkedin_url %}<a href="{{ site.linkedin_url }}">LinkedIn</a>{% endif %}
    </nav>
  </div>
  <div class="wrap copyright">&copy; {{ site.time | date: "%Y" }} {{ site.author | escape }}</div>
</footer>
