<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ "/" | relative_url }}" rel="home"><span class="brand-badge">{% include logo.svg %}</span><span>FineSine</span></a>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ "/" | relative_url }}#posts">Posts</a>
      <a href="{{ "/tags/" | relative_url }}">Tags</a>
      <a href="{{ "/about/" | relative_url }}">About</a>
      {%- if site.linkedin_url %}<a class="nav-cta" href="{{ site.linkedin_url }}">Connect</a>{% endif %}
    </nav>
  </div>
  {%- if page.layout == "post" %}<div class="progress" aria-hidden="true"><span></span></div>{% endif %}
</header>
