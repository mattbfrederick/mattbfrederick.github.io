---
layout: default
---
<main id="main" class="page">
  <header class="post-hero">
    <div class="wrap">
      <p class="crumbs"><a href="{{ "/" | relative_url }}">Home</a> <span aria-hidden="true">›</span> {{ page.title | escape }}</p>
      <h1 class="entry-title">{{ page.title | escape }}</h1>
    </div>
  </header>
  <div class="wrap post-body">
    <article class="entry">
      <div class="entry-content">
        {{ content }}
      </div>
    </article>
  </div>
</main>
