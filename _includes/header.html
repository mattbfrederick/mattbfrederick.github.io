<header class="site-header">
  <div class="site-branding">
    <p class="site-title"><a href="{{ "/" | relative_url }}" rel="home">{{ site.title | escape }}</a></p>
  </div>
  {%- if site.header_pages %}
  <nav class="main-navigation" aria-label="Main">
    <ul>
      {%- for path in site.header_pages %}
      {%- assign nav_page = site.pages | where: "path", path | first %}
      {%- if nav_page.title %}
      <li><a href="{{ nav_page.url | relative_url }}">{{ nav_page.title | escape }}</a></li>
      {%- endif %}
      {%- endfor %}
    </ul>
  </nav>
  {%- endif %}
</header>
