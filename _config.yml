# Site settings. See README.md for publishing and writing posts.
title: FineSine
description: A wireless networking blog...
author: Matt Frederick
url: "https://finesine.com"
twitter_username: mattbfrederick
linkedin_url: "https://www.linkedin.com/in/matthew-frederick-b2220b84"
twitter:
  username: mattbfrederick
timezone: America/Chicago

# Visitor stats: https://finesine.goatcounter.com (remove this line to turn off)
goatcounter: finesine

# Layouts and styles live in this repo (_layouts, _includes, assets/main.scss);
# minima is only a fallback for anything not overridden.
theme: minima

# Home page intro. intro_text can use Markdown for links.
intro_title: "Notes on wireless networking, from the field."
intro_text: "WLAN design, site surveys, how-tos and roaming deep dives by [Matt Frederick](/about/), CWNE #197."

# Author card at the end of every post (LinkedIn link is added after it)
author_initials: MF
author_bio: "**Matt Frederick** is a WLAN consultant and CWNE #197 who has been designing and troubleshooting wireless networks since 2008."

# Same URL shape as the old WordPress site, e.g. /2016/01/14/setting-up-an-aruba-iap-for-a-site-survey/
permalink: /:year/:month/:day/:title/

# Links in the menu at the top of every page
navigation:
  - title: Writing
    url: /
  - title: Topics
    url: /tags/
  - title: About
    url: /about/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - README.md
  - HOW-TO-POST.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
